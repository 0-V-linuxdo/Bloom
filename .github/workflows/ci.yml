name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-update-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check userscript header and update URLs
        run: node scripts/check-update-urls.mjs

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run tsc
      - run: bun run lint
      - run: bun run lint:styles
      - run: bun test
